name: Validate

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # description/topics are GitHub repository settings, only required
          # for inclusion in the default HACS store (not for custom repositories)
          ignore: brands description topics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q tests tests_ha
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check custom_components/ha_sport/www/ha-sport-card.js
